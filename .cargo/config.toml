[alias]
build-ebpf = [
    "build",
    "--release",
    "--package",
    "lrs-ebpf-hello",
    "--target",
    "bpfel-unknown-none",
    "-Z",
    "build-std=core",
    "--config",
    'build.rustflags=["-C", "debuginfo=2", "-C", "link-arg=--btf"]',
]

[target.bpfel-unknown-none]
linker = "bpf-linker"
